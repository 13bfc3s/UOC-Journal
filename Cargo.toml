[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/13bfc3s/UOC-Journal"

[workspace.dependencies]
uoj-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
regex = "1"
memchr = "2"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Keep debug builds snappy for the parser/filter hot paths.
[profile.dev.package."*"]
opt-level = 2
